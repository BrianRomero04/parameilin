let photoIndex=0,photoTimer=0;
function showPhoto(i,instant=false){const img=$('playerCover');img.style.opacity='0';img.style.transform='scale('+(instant?'1':'1.03')+')';setTimeout(()=>{img.src=photos[i];img.style.opacity='1';img.style.transform='scale(1)'},instant?0:160)}
function cyclePhotos(){if(!photos.length)return;photoIndex=(photoIndex+1)%photos.length;showPhoto(photoIndex)}
function initPlayer(){if(photos.length){showPhoto(0,true);clearInterval(photoTimer);photoTimer=setInterval(cyclePhotos,3400)}$('songTitle').textContent='gongoli';$('songArtist').textContent='álvaro díaz & kyoshi reyes';$('currentTime').textContent='0:00';$('totalTime').textContent=formatTime(audio.duration)}
function syncAudioUI(){const toggle=$('audioToggle');toggle.textContent=audio.paused?'▷ reproducir':'❚❚ pausa';$('currentTime').textContent=formatTime(audio.currentTime);$('totalTime').textContent=formatTime(audio.duration);const pct=(audio.duration&&isFinite(audio.duration))?(audio.currentTime/audio.duration)*100:0;$('progressFill').style.width=pct+'%'}
$('audioToggle').onclick=()=>{if(audio.paused){musicPausedByUser=false;startMusic()}else{musicPausedByUser=true;audio.pause()}syncAudioUI()}
audio.addEventListener('timeupdate',syncAudioUI);audio.addEventListener('loadedmetadata',syncAudioUI);audio.addEventListener('durationchange',syncAudioUI);audio.addEventListener('play',syncAudioUI);audio.addEventListener('pause',syncAudioUI);initPlayer();syncAudioUI();

// Background audio: attempt on load, and retry directly on trusted gestures.
function startMusic(){
  if(musicPausedByUser||!audio.paused)return;
  try{const attempt=audio.play();if(attempt)attempt.catch(err=>console.debug('Audio:',err.name));}catch(err){console.debug('Audio:',err.name);}
}
document.addEventListener('click',e=>{if(!e.target.closest('#audioToggle'))startMusic()});
document.addEventListener('keydown',e=>{if(!e.target.closest?.('#audioToggle'))startMusic()});
window.addEventListener('pageshow',startMusic);
startMusic();
</script></body></html>
